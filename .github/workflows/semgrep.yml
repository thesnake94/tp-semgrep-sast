name: DevSecOps - Semgrep SAST Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  semgrep-sast:
    name: Semgrep SAST Quality Gate
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run Semgrep SAST Analysis
        run: |
          semgrep scan \
            --config "p/default" \
            --config "p/owasp-top-ten" \
            --sarif-output semgrep-results.sarif \
            --error
      - name: Upload SARIF report to GitHub Code Security
        uses: github/codeql-action/upload-sarif@bf58c2ac1f8060aa73f1225f461c80391348076a # v4
        if: always()
        with:
          sarif_file: semgrep-results.sarif
      - name: Preserve SARIF report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.sarif
